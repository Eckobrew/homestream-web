name: Web
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:player
      - run: npm run test:contract
      - run: npm run test:playback
      - run: npm run build
      - run: docker build -t homestream-web:test .
      - run: bash scripts/test-docker.sh homestream-web:test
  integration:
    if: vars.HOMESTREAM_BACKEND_REF != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: homestream-web
      - uses: actions/checkout@v4
        with:
          repository: Eckobrew/homestream-backend
          ref: ${{ vars.HOMESTREAM_BACKEND_REF }}
          path: homestream-backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: homestream-backend
      - run: npm ci && npm run build
        working-directory: homestream-web
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npx playwright install --with-deps chromium
        working-directory: homestream-web
      - run: npm run test:e2e
        working-directory: homestream-web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: homestream-web/test-results

  publish:
    needs: [verify, integration]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.result == 'success' && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    concurrency:
      group: publish-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: homestream-publish:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
      - run: bash scripts/test-docker.sh homestream-publish:test
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag homestream-publish:test "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
